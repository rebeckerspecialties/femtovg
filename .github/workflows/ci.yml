name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust:
          - stable
          - beta
          - 1.92.0  # MSRV
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install libxkbcommon-dev libwayland-dev libfontconfig-dev
      - name: Install toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          override: true
          profile: minimal
          target: wasm32-unknown-unknown
      - run: cargo build --verbose
      - run: cargo build --all-features --features glutin/wayland,glutin/egl --verbose
      - run: cargo build --no-default-features --verbose
      - run: cargo build --verbose --target wasm32-unknown-unknown
      - run: cargo build --verbose --examples
      - run: cargo build --verbose --examples --features wgpu
      - run: cargo build --target=wasm32-unknown-unknown --example demo
      - run: cargo test
      - run: cargo test --lib --no-default-features --features swash
      - run: cargo test --lib --features swash
  # `cargo test` above never runs the GPU tests: every tests/*_wgpu.rs is gated
  # behind the `wgpu` feature, which that command does not enable, so each of
  # those executables is built and then reports "running 0 tests". This job
  # runs them for real on a runner with a Metal adapter, once the cheap matrix
  # has passed. FEMTOVG_REQUIRE_GPU makes a missing adapter a failure instead
  # of a skip, so the job cannot go green without having exercised the GPU.
  gpu-tests:
    needs: [build, format]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal
      - name: Run the GPU test suite
        env:
          FEMTOVG_REQUIRE_GPU: metal
        run: cargo test --features wgpu --no-fail-fast -- --nocapture
  # The OpenGL backend's tests (tests/*_gl.rs) need a GL context: Mesa's
  # llvmpipe provides one without a display through surfaceless EGL, and
  # lavapipe gives WGPU a Vulkan adapter for the GL-vs-WGPU parity tests.
  # Mesa reports GLES 3 whatever version is requested, so the backend's
  # GLES 2 paths need a second run with the version overridden.
  # FEMTOVG_REQUIRE_GL names the flavors each run must exercise, so neither
  # can go green by skipping.
  gl-tests:
    needs: [build, format]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install system dependencies and Mesa's software drivers
        run: >-
          sudo apt-get update && sudo apt-get install libxkbcommon-dev libwayland-dev libfontconfig-dev
          libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri mesa-vulkan-drivers
      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal
      - name: Run the GL tests on desktop GL and GLES 3
        env:
          FEMTOVG_REQUIRE_GL: desktop,gles3
          FEMTOVG_REQUIRE_GPU: vulkan
        run: cargo test --features wgpu --no-fail-fast --test '*_gl' --test image_upload_stride -- --nocapture
      - name: Run the GL tests on desktop GL and GLES 2
        env:
          MESA_GLES_VERSION_OVERRIDE: "2.0"
          FEMTOVG_REQUIRE_GL: desktop,gles2
          FEMTOVG_REQUIRE_GPU: vulkan
        run: cargo test --features wgpu --no-fail-fast --test '*_gl' --test image_upload_stride -- --nocapture
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install libxkbcommon-dev libwayland-dev libfontconfig-dev
      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
            toolchain: stable
            override: true
            components: rustfmt, clippy
      - name: Run rustfmt
        run: cargo fmt --all -- --check
      - name: Run clippy
        uses: actions-rs/clippy-check@v1
        if: github.repository == 'femtovg/femtovg'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --all-features --features glutin/wayland,glutin/egl --no-deps
