<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="200" height="200" viewBox="0 0 200 200">
  <!--
    FemtoVG PR #355 / resvg feBlend Subregion Reftest (Input 2)
    Spec: https://drafts.fxtf.org/filter-effects-1/#FilterPrimitiveSubRegion
    Invariant: feFlood with subregion is passed as in2 to feBlend, with in="SourceGraphic".
               Multiply is commutative; inside subregion evaluates to #174657, outside leaves seagreen #2E8B57.
  -->
  <html:link rel="match" href="feblend-subregion-input2-ref.svg"/>
  <defs>
    <filter id="f2" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#0000FF" flood-opacity="0.5" x="50" y="50" width="100" height="100" result="flood"/>
      <feBlend mode="multiply" in="SourceGraphic" in2="flood"/>
    </filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" fill="#2E8B57" filter="url(#f2)"/>
</svg>
