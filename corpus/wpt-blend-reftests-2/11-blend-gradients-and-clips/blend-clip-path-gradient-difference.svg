<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="200" height="200" viewBox="0 0 200 200">
  <!--
    FemtoVG PR #356 Reftest: Non-convex polygon clip path with linear gradient and mix-blend-mode: difference
    Spec: https://drafts.fxtf.org/compositing-1/#mix-blend-mode
    Invariant: Difference over black (Cb=0) computes |Cs - 0| = Cs (identity).
               Tests non-convex stencil path clipping resolution during layer blend resolve.
  -->
  <html:link rel="match" href="blend-clip-path-gradient-difference-ref.svg"/>
  <defs>
    <linearGradient id="starGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF0080"/>
      <stop offset="100%" stop-color="#00FFFF"/>
    </linearGradient>
    <clipPath id="starClip">
      <polygon points="100,15 125,75 190,75 137,112 158,175 100,135 42,175 63,112 10,75 75,75"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="200" height="200" fill="#000000"/>
  <rect x="0" y="0" width="200" height="200" fill="url(#starGrad)" clip-path="url(#starClip)" style="mix-blend-mode: difference;"/>
</svg>
