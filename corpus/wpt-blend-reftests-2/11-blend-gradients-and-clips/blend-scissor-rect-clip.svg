<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="200" height="200" viewBox="0 0 200 200">
  <!--
    FemtoVG PR #356 Reftest: Rectangular clip-path on multiply blended layer
    Spec: https://drafts.fxtf.org/compositing-1/#mix-blend-mode
    Invariant: Backdrop is seagreen (#2E8B57). Blended rect (lightblue #ADD8E6) has clip-path rect [50, 50, 100, 100].
               Inside clip: #1F764E. Outside clip: untouched #2E8B57.
  -->
  <html:link rel="match" href="blend-scissor-rect-clip-ref.svg"/>
  <defs>
    <clipPath id="rectClip">
      <rect x="50" y="50" width="100" height="100"/>
    </clipPath>
  </defs>
  <rect x="20" y="20" width="160" height="160" fill="#2E8B57"/>
  <rect x="20" y="20" width="160" height="160" fill="#ADD8E6" clip-path="url(#rectClip)" style="mix-blend-mode: multiply;"/>
</svg>
