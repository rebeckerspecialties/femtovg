<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="200" height="200" viewBox="0 0 200 200">
  <!--
    FemtoVG PR #356 / resvg opacity-on-group Reftest
    Spec: https://drafts.fxtf.org/compositing-1/#csscompositingrules_SVG
    Invariant: Group has opacity="0.5" AND mix-blend-mode: multiply over white backdrop (#FFFFFF).
               Over white backdrop, multiply is an identity operation, matching group opacity alone.
  -->
  <html:link rel="match" href="blend-group-opacity-gradient-ref.svg"/>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF0000"/>
      <stop offset="100%" stop-color="#0000FF"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="200" height="200" fill="#FFFFFF"/>
  <g opacity="0.5" style="mix-blend-mode: multiply;">
    <rect x="20" y="20" width="160" height="160" fill="url(#g1)"/>
  </g>
</svg>
