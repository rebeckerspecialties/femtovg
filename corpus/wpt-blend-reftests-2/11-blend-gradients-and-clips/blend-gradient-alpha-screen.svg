<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="200" height="200" viewBox="0 0 200 200">
  <!--
    FemtoVG PR #356 Reftest: Gradient with variable alpha stops and mix-blend-mode: screen over black backdrop
    Spec: https://drafts.fxtf.org/compositing-1/#mix-blend-mode
    Invariant: Screening any color Cs with black backdrop (Cb=0) yields Cs identically (0 + Cs - 0 = Cs).
               Tests non-premultiplied and premultiplied alpha handling during blend shader resolve.
  -->
  <html:link rel="match" href="blend-gradient-alpha-screen-ref.svg"/>
  <defs>
    <linearGradient id="alphaGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#00FF88" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0088FF" stop-opacity="1.0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="200" height="200" fill="#000000"/>
  <rect x="20" y="20" width="160" height="160" fill="url(#alphaGrad)" style="mix-blend-mode: screen;"/>
</svg>
