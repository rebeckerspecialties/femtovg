<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="200" height="200" viewBox="0 0 200 200">
  <!--
    FemtoVG PR #355 Color Space Transition Reftest
    Spec: https://drafts.fxtf.org/filter-effects-1/#ColorInterpolationFiltersProperty
    Invariant: feFlood operates in linearRGB, but feeds feColorMatrix in sRGB.
               Renderer must convert buffer across color spaces before executing feColorMatrix and feBlend in sRGB.
               Output matches sRGB multiply: #1F764E.
  -->
  <html:link rel="match" href="filter-chain-colorspace-transition-ref.svg"/>
  <defs>
    <filter id="fTransition" x="0%" y="0%" width="100%" height="100%">
      <feFlood flood-color="#ADD8E6" color-interpolation-filters="linearRGB" result="floodLin"/>
      <feColorMatrix type="identity" in="floodLin" color-interpolation-filters="sRGB" result="floodSrgb"/>
      <feBlend mode="multiply" in="floodSrgb" in2="SourceGraphic" color-interpolation-filters="sRGB"/>
    </filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" fill="#2E8B57" filter="url(#fTransition)"/>
</svg>
