<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="200" height="200" viewBox="0 0 200 200">
  <!--
    FemtoVG PR #355 Color Space Reftest: linearRGB feBlend screen
    Spec: https://drafts.fxtf.org/filter-effects-1/#ColorInterpolationFiltersProperty
    Invariant: In linearRGB, screen of seagreen (#2E8B57) and lightblue (#ADD8E6) yields [176, 227, 233] (#B0E3E9).
               In unlinearized sRGB it yields [188, 237, 239] (#BCEDEF).
  -->
  <html:link rel="match" href="feblend-colorspace-linearrgb-screen-ref.svg"/>
  <defs>
    <filter id="fLinearScreen" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="linearRGB">
      <feFlood flood-color="#ADD8E6" result="flood"/>
      <feBlend mode="screen" in="flood" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" fill="#2E8B57" filter="url(#fLinearScreen)"/>
</svg>
