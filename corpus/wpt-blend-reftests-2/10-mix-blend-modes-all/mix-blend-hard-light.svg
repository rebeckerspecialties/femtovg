<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="200" height="200" viewBox="0 0 200 200">
  <!--
    FemtoVG PR #356 / WPT CSS Compositing mix-blend-mode on layer
    Spec: https://drafts.fxtf.org/compositing-1/#mix-blend-mode
    Invariant: LayerEffects::with_blend(BlendMode::Hard_Light)
               Backdrop is seagreen (#2E8B57) on [20, 20, 160, 160].
               Blended layer has mix-blend-mode: hard-light containing lightblue (#ADD8E6) on [60, 60, 120, 120].
               Overlap region computes exact sRGB #79DCDE, while non-overlapping region preserves #2E8B57.
  -->
  <html:link rel="match" href="mix-blend-hard-light-ref.svg"/>
  <rect x="20" y="20" width="160" height="160" fill="#2E8B57"/>
  <g style="mix-blend-mode: hard-light;">
    <rect x="60" y="60" width="120" height="120" fill="#ADD8E6"/>
  </g>
</svg>
