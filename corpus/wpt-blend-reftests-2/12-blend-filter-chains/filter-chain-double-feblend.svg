<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="200" height="200" viewBox="0 0 200 200">
  <!--
    FemtoVG PR #355 Chained feBlend Reftest
    Spec: https://drafts.fxtf.org/filter-effects-1/#feBlendElement
    Invariant: Two sequential feBlend primitives.
               Blend 1: red (#FF0000) screen green (#00FF00) -> yellow (#FFFF00).
               Blend 2: blue (#0000FF) screen yellow (#FFFF00) -> white (#FFFFFF).
  -->
  <html:link rel="match" href="filter-chain-double-feblend-ref.svg"/>
  <defs>
    <filter id="fDoubleBlend" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#FF0000" result="red"/>
      <feFlood flood-color="#00FF00" result="green"/>
      <feFlood flood-color="#0000FF" result="blue"/>
      <feBlend mode="screen" in="red" in2="green" result="blend1"/>
      <feBlend mode="screen" in="blue" in2="blend1" result="blend2"/>
    </filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" fill="#000000" filter="url(#fDoubleBlend)"/>
</svg>
