<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="200" height="200" viewBox="0 0 200 200">
  <!--
    FemtoVG PR #355 Drop Shadow Pipeline Reftest
    Spec: https://drafts.fxtf.org/filter-effects-1/#feOffsetElement & #feGaussianBlurElement & #feBlendElement
    Invariant: Standard drop-shadow chain (feOffset dx=0 dy=0 -> feGaussianBlur stdDev=0 -> feFlood green -> feComposite in).
               feBlend mode="screen" composites red SourceGraphic with green shadow -> yellow (#FFFF00).
  -->
  <html:link rel="match" href="filter-chain-offset-blur-feblend-ref.svg"/>
  <defs>
    <filter id="fShadow" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="0" dy="0" result="offset"/>
      <feGaussianBlur in="offset" stdDeviation="0" result="blur"/>
      <feFlood flood-color="#00FF00" result="green"/>
      <feComposite in="green" in2="blur" operator="in" result="shadow"/>
      <feBlend mode="screen" in="SourceGraphic" in2="shadow"/>
    </filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" fill="#FF0000" filter="url(#fShadow)"/>
</svg>
