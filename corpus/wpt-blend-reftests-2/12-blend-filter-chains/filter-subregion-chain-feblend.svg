<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="200" height="200" viewBox="0 0 200 200">
  <!--
    FemtoVG PR #355 Filter Subregion Chain Reftest
    Spec: https://drafts.fxtf.org/filter-effects-1/#FilterPrimitiveSubRegion
    Invariant: Flood 1 (red #FF0000) covers full rect [20, 20, 160, 160].
               Flood 2 (green #00FF00) has subregion [60, 60, 80, 80].
               feBlend mode="screen":
               Inside subregion: red screen green -> yellow (#FFFF00).
               Outside subregion: flood 2 is transparent -> pure red (#FF0000).
  -->
  <html:link rel="match" href="filter-subregion-chain-feblend-ref.svg"/>
  <defs>
    <filter id="fSubChain" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#FF0000" x="20" y="20" width="160" height="160" result="red"/>
      <feFlood flood-color="#00FF00" x="60" y="60" width="80" height="80" result="green"/>
      <feBlend mode="screen" in="green" in2="red"/>
    </filter>
  </defs>
  <rect x="20" y="20" width="160" height="160" fill="#000000" filter="url(#fSubChain)"/>
</svg>
