<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- A rect clip at fractional positions over a fill that extends past it: is the clip's edge antialiased? -->
  <clipPath id="c"><rect x="20.3" y="30.6" width="50.5" height="30.25"/></clipPath>
  <rect x="0" y="0" width="200" height="200" fill="green" clip-path="url(#c)"/>
</svg>
