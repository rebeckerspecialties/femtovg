<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- A rounded-rect path clip over a fill of the same path, at fractional positions -->
  <clipPath id="c"><rect x="20.3" y="30.6" width="80.5" height="60.25" rx="12"/></clipPath>
  <g clip-path="url(#c)"><rect x="20.3" y="30.6" width="80.5" height="60.25" rx="12" fill="green"/></g>
</svg>
