<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- A rounded-rect clip over a plain rect with the clip's bounds: the fill's sides lie on the clip's straight sides -->
  <clipPath id="c"><rect x="20.3" y="30.6" width="80.5" height="60.25" rx="12"/></clipPath>
  <g clip-path="url(#c)"><rect x="20.3" y="30.6" width="80.5" height="60.25" fill="green"/></g>
</svg>
