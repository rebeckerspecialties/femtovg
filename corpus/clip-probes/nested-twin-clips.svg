<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- A rect clip nested in its twin, as design tools export frames: does the edge take the clip's coverage once or twice? -->
  <clipPath id="c"><rect x="20.3" y="30.6" width="50.5" height="30.25"/></clipPath>
  <clipPath id="d"><rect x="20.3" y="30.6" width="50.5" height="30.25"/></clipPath>
  <g clip-path="url(#c)"><g clip-path="url(#d)"><rect x="0" y="0" width="200" height="200" fill="green"/></g></g>
</svg>
