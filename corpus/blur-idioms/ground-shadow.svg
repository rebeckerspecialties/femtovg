<svg xmlns="http://www.w3.org/2000/svg" width="240" height="180" viewBox="0 0 240 180">
  <!-- An object over a soft ground shadow: a flat ellipse blurred far more along x than y. -->
  <defs>
    <filter id="ground" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="12 2.5"/>
    </filter>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#4f9cff"/>
      <stop offset="1" stop-color="#0b2a6f"/>
    </radialGradient>
  </defs>
  <rect width="240" height="180" fill="#f4f1ea"/>
  <ellipse cx="120" cy="140" rx="54" ry="9" fill="#2b2b2b" opacity="0.55" filter="url(#ground)"/>
  <circle cx="120" cy="86" r="42" fill="url(#ball)"/>
  <rect x="30" y="120" width="40" height="14" rx="3" fill="#8b5e34"/>
  <rect x="25" y="126" width="50" height="6" fill="#2b2b2b" opacity="0.45" filter="url(#ground)"/>
</svg>
