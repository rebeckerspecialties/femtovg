<svg xmlns="http://www.w3.org/2000/svg" width="320" height="120" viewBox="0 0 320 120">
  <!-- A speed streak: the wordmark's shapes blurred along x only, the sharp copy on top (the usual two-copy idiom). -->
  <defs>
    <filter id="streak" x="-40%" y="-20%" width="180%" height="140%">
      <feGaussianBlur stdDeviation="14 0"/>
    </filter>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a00"/>
      <stop offset="1" stop-color="#ee0979"/>
    </linearGradient>
  </defs>
  <rect width="320" height="120" fill="#101828"/>
  <g filter="url(#streak)" opacity="0.9">
    <rect x="90" y="30" width="44" height="60" rx="6" fill="url(#g)"/>
    <circle cx="170" cy="60" r="30" fill="url(#g)"/>
    <path d="M210 90 L232 30 L254 90 Z" fill="url(#g)"/>
  </g>
  <rect x="90" y="30" width="44" height="60" rx="6" fill="url(#g)"/>
  <circle cx="170" cy="60" r="30" fill="url(#g)"/>
  <path d="M210 90 L232 30 L254 90 Z" fill="url(#g)"/>
</svg>
