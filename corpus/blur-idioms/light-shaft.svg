<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- A vertical light shaft and reflection: tall narrow glows blurred along y only. -->
  <defs>
    <filter id="shaft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="0 28"/>
    </filter>
    <filter id="reflect" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="1 10"/>
    </filter>
  </defs>
  <rect width="240" height="240" fill="#0b1020"/>
  <rect x="60" y="20" width="24" height="200" fill="#9ad8ff" opacity="0.85" filter="url(#shaft)"/>
  <rect x="130" y="20" width="10" height="200" fill="#ffd166" opacity="0.9" filter="url(#shaft)"/>
  <rect x="170" y="150" width="50" height="4" fill="#ffffff" filter="url(#reflect)"/>
  <circle cx="195" cy="120" r="18" fill="#ffffff"/>
</svg>
