<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="200" height="200" viewBox="0 0 200 200">
  <html:link rel="match" href="clip-path-objectboundingbox-rect-ref.svg"/>
  <defs>
    <clipPath id="cp" clipPathUnits="objectBoundingBox">
      <rect x="0.2" y="0.2" width="0.6" height="0.6"/>
    </clipPath>
  </defs>
  <rect x="20" y="20" width="100" height="100" fill="green" clip-path="url(#cp)"/>
</svg>
