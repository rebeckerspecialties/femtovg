<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="200" height="200" viewBox="0 0 200 200">
  <!--
    Cross-checks: Issue #325 ("Gaussian blur kernel diverges from browser rendering on structured content")
    Spec: SVG Filter Effects 1 § 14.1 ('feGaussianBlur' and 'edgeMode')
    Invariant: Default edgeMode="none" in feGaussianBlur requires that pixels outside the input
               element boundary are treated as transparent black (0, 0, 0, 0).
               When a 100x100 solid green rectangle is blurred with stdDeviation="8", the blur
               must fade smoothly to alpha=0 over its 3*sigma (24px) reach.
               There must be NO edge clamping, NO repeating of edge pixels, and NO opaque rectangular
               border seam.
  -->
  <html:link rel="match" href="blur-edge-mode-transparent-fade-ref.svg"/>
  <defs>
    <!-- Filter region extended by 50% to accommodate the full 3*sigma blur reach -->
    <filter id="blur-transparent-edge" x="-50%" y="-50%" width="200%" height="200%" edgeMode="none">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Canvas background: dark slate -->
  <rect width="200" height="200" fill="#1A1A2E"/>

  <!-- Centered 100x100 green rect blurred with transparent edge fade -->
  <rect x="50" y="50" width="100" height="100" fill="#00FF00" filter="url(#blur-transparent-edge)"/>
</svg>
