<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- A dark, tinted drop shadow in linearRGB, the same over black (left) and over white (right), so the
       shadow's alpha and colour can be told apart at every pixel. Premultiplied in linearRGB at 8 bits,
       #2b1712 at .42 is 2.6, 0.9 and 0.65 of a step (kimi-k3's shadow); #0b0d10 at .6 is 0.5, 0.6 and
       0.8 (claude-opus-5's dropHair). Top row the feDropShadow, bottom row the same as written-out
       primitives. -->
  <defs>
    <filter id="brown" x="-50%" y="-50%" width="200%" height="300%">
      <feDropShadow dx="0" dy="12" stdDeviation="6" flood-color="#2b1712" flood-opacity=".42"/>
    </filter>
    <filter id="hair" x="-50%" y="-50%" width="200%" height="300%">
      <feDropShadow dx="0" dy="12" stdDeviation="6" flood-color="#0b0d10" flood-opacity=".6"/>
    </filter>
    <filter id="brownChain" x="-50%" y="-50%" width="200%" height="300%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="12" result="b"/>
      <feFlood flood-color="#2b1712" flood-opacity=".42"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="100" height="200" fill="#000"/>
  <rect x="100" y="0" width="100" height="200" fill="#fff"/>
  <g filter="url(#brown)"><rect x="12" y="8" width="30" height="20" fill="#808080"/></g>
  <g filter="url(#brown)"><rect x="112" y="8" width="30" height="20" fill="#808080"/></g>
  <g filter="url(#hair)"><rect x="58" y="8" width="30" height="20" fill="#808080"/></g>
  <g filter="url(#hair)"><rect x="158" y="8" width="30" height="20" fill="#808080"/></g>
  <g filter="url(#brownChain)"><rect x="12" y="100" width="30" height="20" fill="#808080"/></g>
  <g filter="url(#brownChain)"><rect x="112" y="100" width="30" height="20" fill="#808080"/></g>
</svg>
