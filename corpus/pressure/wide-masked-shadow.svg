<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="256" viewBox="0 0 2048 256">
  <!-- A masked group as wide as a 2048 px texture limit, under a blurred
       drop shadow with no offset. A caster crossing the right edge throws
       its shadow back into view; the filter region spans the reach. -->
  <defs>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="-64" y="-64" width="2240" height="384">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <mask id="window" maskUnits="userSpaceOnUse" x="0" y="0" width="2048" height="256">
      <rect x="0" y="0" width="2048" height="256" fill="#fff"/>
      <rect x="1024" y="64" width="256" height="128" fill="#000"/>
    </mask>
  </defs>
  <rect width="2048" height="256" fill="#e8d8c8"/>
  <g filter="url(#shadow)" mask="url(#window)">
    <rect x="0" y="32" width="2048" height="192" fill="#3a2a60"/>
    <rect x="2000" y="8" width="120" height="240" fill="#8a1a1a"/>
    <rect x="900" y="40" width="500" height="176" fill="#1a7a3a"/>
  </g>
</svg>
