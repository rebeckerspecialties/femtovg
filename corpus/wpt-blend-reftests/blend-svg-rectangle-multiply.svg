<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="100" height="100" viewBox="0 0 100 100">
  <!--
    WPT Test: css/compositing/svg/mix-blend-mode-svg-rectangle.html
    Spec: https://drafts.fxtf.org/compositing-1/#csscompositingrules_SVG & https://drafts.fxtf.org/compositing-1/#mix-blend-mode
    Invariant: Basic SVG element-to-element blending using separable blend mode (multiply).
               Backdrop rect is aqua (#00FFFF). Blended rect is red (#FF0000) with mix-blend-mode: multiply.
               Multiply of aqua (0, 255, 255) and red (255, 0, 0) is black (#000000).
               Test passes if you see a solid black square (no red or aqua visible).
  -->
  <html:link rel="match" href="blend-svg-rectangle-multiply-ref.svg"/>

  <!-- Aqua backdrop -->
  <rect x="0" y="0" width="100" height="100" fill="#00FFFF"/>

  <!-- Red rect with multiply blend mode -->
  <rect x="0" y="0" width="100" height="100" fill="#FF0000" style="mix-blend-mode: multiply;"/>
</svg>
