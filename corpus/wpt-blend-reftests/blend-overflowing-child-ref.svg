<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Reference for blend-overflowing-child.svg: Two green squares with black intersection over lightgray -->
  <!-- Canvas background: lightgray -->
  <rect width="200" height="200" fill="#D3D3D3"/>

  <!-- First green square (100x100 at 0,0) -->
  <rect x="0" y="0" width="100" height="100" fill="#00FF00"/>

  <!-- Second green square (100x100 at 50,50) -->
  <rect x="50" y="50" width="100" height="100" fill="#00FF00"/>

  <!-- Intersection square (50x50 at 50,50): black -->
  <rect x="50" y="50" width="50" height="50" fill="#000000"/>
</svg>
