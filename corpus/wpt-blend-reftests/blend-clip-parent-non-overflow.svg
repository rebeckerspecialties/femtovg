<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="140" height="140" viewBox="0 0 140 140">
  <!--
    WPT Test: css/compositing/mix-blend-mode/mix-blend-mode-parent-with-border-radius.html
    Spec: https://drafts.fxtf.org/compositing-1/#mix-blend-mode
    Invariant: Tests blending with a non-rectangular parent without overflow clipping.
               Parent creates a stacking context with a red circle (r=50 at 70,70).
               Child is a yellow 100x100 square (x=20, y=20) with mix-blend-mode: difference.
               Inside the circle: red diff yellow = lime (#00FF00).
               Outside the circle: child does NOT blend with lightgray canvas background;
               it renders yellow. Result is a green circle inside a yellow square over lightgray.
  -->
  <html:link rel="match" href="blend-clip-parent-non-overflow-ref.svg"/>

  <!-- Canvas background: lightgray -->
  <rect width="140" height="140" fill="#D3D3D3"/>

  <!-- Stacking context group (without overflow clipping) -->
  <g style="isolation: isolate;">
    <!-- Parent circular backdrop: red -->
    <circle cx="70" cy="70" r="50" fill="#FF0000"/>
    <!-- Child square with mix-blend-mode: difference -->
    <rect x="20" y="20" width="100" height="100" fill="#FFFF00" style="mix-blend-mode: difference;"/>
  </g>
</svg>
