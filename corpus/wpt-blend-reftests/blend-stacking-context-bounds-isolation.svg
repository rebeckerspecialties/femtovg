<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="130" height="130" viewBox="0 0 130 130">
  <!--
    WPT Test: css/compositing/mix-blend-mode/mix-blend-mode-stacking-context-creates-isolation.html
    Spec: https://drafts.fxtf.org/compositing-1/#mix-blend-mode
    Invariant: An isolated stacking context creates an isolated group.
               Container is yellow (#FFFF00). The isolated group contains a lime square (#00FF00, 100x100)
               and an overlapping red square (#FF0000, 100x100 at 20,20) with mix-blend-mode: multiply.
               - At their intersection (80x80 at 20,20): red multiply lime = black (#000000).
               - Where the red square overflows the lime element (20px right and bottom): the backdrop
                 inside the isolated group is transparent, so it does NOT blend with outer yellow.
  -->
  <html:link rel="match" href="blend-stacking-context-bounds-isolation-ref.svg"/>

  <!-- Container: yellow -->
  <rect width="130" height="130" fill="#FFFF00"/>

  <!-- Stacking context group -->
  <g style="isolation: isolate;">
    <!-- Base element in stacking context: lime -->
    <rect x="0" y="0" width="100" height="100" fill="#00FF00"/>
    <!-- Blended element: red multiply -->
    <rect x="20" y="20" width="100" height="100" fill="#FF0000" style="mix-blend-mode: multiply;"/>
  </g>
</svg>
