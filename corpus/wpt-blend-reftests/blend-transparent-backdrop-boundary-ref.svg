<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
  <!-- Reference for blend-transparent-backdrop-boundary.svg: 100x100 lime square with 10px aqua border -->
  <!-- Canvas background: white -->
  <rect width="140" height="140" fill="#FFFFFF"/>

  <!-- Aqua border base (120x120 at 0,0) -->
  <rect x="0" y="0" width="120" height="120" fill="#00FFFF"/>

  <!-- Inner lime square (100x100 at 10,10) -->
  <rect x="10" y="10" width="100" height="100" fill="#00FF00"/>
</svg>
