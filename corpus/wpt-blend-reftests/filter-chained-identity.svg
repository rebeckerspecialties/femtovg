<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="100" height="100" viewBox="0 0 100 100">
  <!--
    WPT Test: css/filter-effects/filter-chained-url-url-001.html
    Spec: https://drafts.fxtf.org/filter-effects/#FilterProperty
    Invariant: Chained filter graph evaluation through multiple filter primitives (feColorMatrix stages)
               evaluates in order and preserves color channels and alpha without degradation.
  -->
  <html:link rel="match" href="filter-chained-identity-ref.svg"/>
  <defs>
    <filter id="chained-identity" color-interpolation-filters="linearRGB">
      <feColorMatrix type="identity" result="step1"/>
      <feColorMatrix in="step1" type="identity" result="step2"/>
    </filter>
  </defs>

  <rect width="100" height="100" fill="#008000" filter="url(#chained-identity)"/>
</svg>
