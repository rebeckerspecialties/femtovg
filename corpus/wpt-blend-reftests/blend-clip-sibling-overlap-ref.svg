<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Reference for blend-clip-sibling-overlap.svg -->
  <defs>
    <clipPath id="sibling-rounded-clip">
      <rect x="0" y="0" width="150" height="150" rx="32" ry="32"/>
    </clipPath>
  </defs>

  <!-- Base layer outside clip: aqua on top, yellow on bottom -->
  <rect x="0" y="0" width="150" height="75" fill="#00FFFF"/>
  <rect x="0" y="75" width="150" height="75" fill="#FFFF00"/>

  <!-- Inside clip: yellow on top, aqua on bottom -->
  <g clip-path="url(#sibling-rounded-clip)">
    <rect x="0" y="0" width="150" height="75" fill="#FFFF00"/>
    <rect x="0" y="75" width="150" height="75" fill="#00FFFF"/>
  </g>
</svg>
