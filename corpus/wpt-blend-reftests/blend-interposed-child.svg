<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="100" height="100" viewBox="0 0 100 100">
  <!--
    WPT Test: css/compositing/mix-blend-mode/mix-blend-mode-blended-element-interposed.html
    Spec: https://drafts.fxtf.org/compositing-1/#mix-blend-mode
    Invariant: Children inside an element with mix-blend-mode are composited together into the
               element's buffer before blending with the backdrop.
               Parent backdrop is yellow (#FFFF00).
               Blender group has mix-blend-mode: difference and contains a dark base (#334455)
               and an opaque red child (#FF0000) that completely covers the dark base.
               The group composites to red (#FF0000), which then blends with yellow (#FFFF00)
               using difference, yielding lime (#00FF00).
               Test passes if you see a solid lime square.
  -->
  <html:link rel="match" href="blend-interposed-child-ref.svg"/>

  <!-- Parent backdrop: yellow -->
  <rect width="100" height="100" fill="#FFFF00"/>

  <!-- Blender group with interposed child -->
  <g style="mix-blend-mode: difference;">
    <!-- Base inside blender (completely covered by child) -->
    <rect width="100" height="100" fill="#334455"/>
    <!-- Child of blender -->
    <rect width="100" height="100" fill="#FF0000"/>
  </g>
</svg>
