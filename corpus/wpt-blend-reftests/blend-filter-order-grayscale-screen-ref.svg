<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Reference for blend-filter-order-grayscale-screen.svg -->
  <defs>
    <filter id="grayscale-filter" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="
        0.2126 0.7152 0.0722 0 0
        0.2126 0.7152 0.0722 0 0
        0.2126 0.7152 0.0722 0 0
        0      0      0      1 0"/>
    </filter>
  </defs>

  <!-- Green backdrop -->
  <rect width="200" height="200" fill="#008000"/>

  <!-- Decomposed reference: filter applied in inner group, mix-blend-mode screen in outer group -->
  <g style="mix-blend-mode: screen;">
    <rect width="200" height="200" fill="#FF0000" filter="url(#grayscale-filter)"/>
  </g>
</svg>
