<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <title>feBlend after a blur in the same chain, against the source graphic</title>
  <filter id="f" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feBlend in="b" in2="SourceGraphic" mode="multiply"/></filter>
  <rect x="20" y="20" width="140" height="140" fill="green"/>
  <rect x="50" y="50" width="120" height="120" fill="orange" filter="url(#f)"/>
  <rect x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
