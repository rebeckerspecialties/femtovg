<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <title>A blending element inside a clipped group: the clip bounds the blended composite</title>
  <clipPath id="c"><circle cx="100" cy="100" r="70"/></clipPath>
  <rect x="20" y="20" width="140" height="140" fill="green"/>
  <g clip-path="url(#c)">
    <rect x="40" y="40" width="140" height="140" fill="orange" style="mix-blend-mode:multiply"/>
  </g>
  <rect x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
