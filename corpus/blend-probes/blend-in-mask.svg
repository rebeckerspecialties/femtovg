<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <title>A blending element inside a masked group</title>
  <mask id="m"><rect x="0" y="0" width="200" height="200" fill="white"/><circle cx="100" cy="100" r="40" fill="black"/></mask>
  <rect x="20" y="20" width="140" height="140" fill="green"/>
  <g mask="url(#m)">
    <rect x="40" y="40" width="140" height="140" fill="orange" style="mix-blend-mode:difference"/>
  </g>
  <rect x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
