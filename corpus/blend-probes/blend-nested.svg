<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <title>A blending group inside a blending group: the inner one reads the outer group's own content</title>
  <rect x="20" y="20" width="140" height="140" fill="green"/>
  <g style="mix-blend-mode:multiply">
    <rect x="40" y="40" width="120" height="120" fill="orange"/>
    <g style="mix-blend-mode:screen">
      <rect x="70" y="70" width="100" height="100" fill="blue"/>
    </g>
  </g>
  <rect x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
