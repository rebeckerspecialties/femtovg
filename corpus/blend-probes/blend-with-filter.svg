<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <title>The blending group is blurred first: the chain's result blends</title>
  <filter id="f" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  <rect x="20" y="20" width="140" height="140" fill="green"/>
  <g filter="url(#f)" style="mix-blend-mode:multiply">
    <rect x="50" y="50" width="120" height="120" fill="orange"/>
  </g>
  <rect x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
