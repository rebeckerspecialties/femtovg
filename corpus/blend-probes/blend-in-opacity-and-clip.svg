<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <title>A blending element inside a group with opacity (isolating) and a clip, over a translucent backdrop</title>
  <clipPath id="c"><rect x="30" y="30" width="140" height="120"/></clipPath>
  <rect x="20" y="20" width="140" height="140" fill="green" fill-opacity="0.5"/>
  <g opacity="0.7" clip-path="url(#c)">
    <rect x="40" y="40" width="140" height="140" fill="orange" style="mix-blend-mode:hard-light"/>
  </g>
  <rect x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
