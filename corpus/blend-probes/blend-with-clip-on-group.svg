<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <title>The blending group carries the clip-path itself</title>
  <clipPath id="c"><circle cx="100" cy="100" r="70"/></clipPath>
  <rect x="20" y="20" width="140" height="140" fill="green"/>
  <g clip-path="url(#c)" style="mix-blend-mode:screen">
    <rect x="40" y="40" width="140" height="140" fill="orange"/>
    <rect x="60" y="60" width="60" height="60" fill="blue"/>
  </g>
  <rect x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
