<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="200" height="200" viewBox="0 0 200 200">
  <html:link rel="match" href="blur-ancestor-clip-containment-ref.svg"/>
  <defs>
    <clipPath id="cp">
      <rect x="30" y="30" width="100" height="100"/>
    </clipPath>
    <filter id="f" x="0%" y="0%" width="100%" height="100%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>
  <!-- Background canvas -->
  <rect x="0" y="0" width="200" height="200" fill="white"/>
  <g clip-path="url(#cp)">
    <rect x="30" y="30" width="100" height="100" fill="red" filter="url(#f)"/>
  </g>
  <!-- Covering green rect matching clip bounds -->
  <rect x="30" y="30" width="100" height="100" fill="green"/>
</svg>
