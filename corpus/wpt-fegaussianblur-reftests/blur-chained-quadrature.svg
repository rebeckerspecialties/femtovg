<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="200" height="200" viewBox="0 0 200 200">
  <html:link rel="match" href="blur-chained-quadrature-ref.svg"/>
  <defs>
    <filter id="fChain" x="0%" y="0%" width="100%" height="100%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b1"/>
      <feGaussianBlur in="b1" stdDeviation="4"/>
    </filter>
  </defs>
  <rect x="40" y="40" width="80" height="80" fill="green" filter="url(#fChain)"/>
</svg>
