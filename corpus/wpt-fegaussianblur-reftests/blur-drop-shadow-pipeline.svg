<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="200" height="200" viewBox="0 0 200 200">
  <html:link rel="match" href="blur-drop-shadow-pipeline-ref.svg"/>
  <defs>
    <filter id="fShadow" x="0%" y="0%" width="100%" height="100%">
      <feOffset in="SourceAlpha" dx="0" dy="0" result="offset"/>
      <feGaussianBlur in="offset" stdDeviation="0" result="blur"/>
      <feFlood flood-color="green" result="flood"/>
      <feComposite in="flood" in2="blur" operator="in"/>
    </filter>
  </defs>
  <rect x="40" y="40" width="80" height="80" fill="black" filter="url(#fShadow)"/>
</svg>
