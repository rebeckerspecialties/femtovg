<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="200" height="200" viewBox="0 0 200 200">
  <html:link rel="match" href="offset-triple-chain-rgb-shadow-ref.svg"/>
  <defs>
    <filter id="f" x="0%" y="0%" width="100%" height="100%">
      <feOffset in="SourceGraphic" dx="10" dy="10" result="s1"/>
      <feOffset in="SourceGraphic" dx="20" dy="20" result="s2"/>
      <feMerge>
        <feMergeNode in="s2"/>
        <feMergeNode in="s1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="20" y="20" width="50" height="50" fill="green" filter="url(#f)"/>
</svg>
