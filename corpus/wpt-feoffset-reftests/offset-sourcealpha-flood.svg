<svg xmlns="http://www.w3.org/2000/svg" xmlns:html="http://www.w3.org/1999/xhtml" width="200" height="200" viewBox="0 0 200 200">
  <html:link rel="match" href="offset-sourcealpha-flood-ref.svg"/>
  <defs>
    <filter id="f" x="0%" y="0%" width="100%" height="100%">
      <feOffset in="SourceAlpha" dx="25" dy="25" result="off"/>
      <feFlood flood-color="navy" result="color"/>
      <feComposite in="color" in2="off" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="20" y="20" width="60" height="60" fill="green" filter="url(#f)"/>
</svg>
